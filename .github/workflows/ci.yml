name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg   # real MP3/FLAC/OGG/M4A/MP4 files for the duration tests
      - run: npm ci
      # src/ and public/ are the source of truth; the desktop/Android copies must match.
      - run: npm run sync:check
      - run: npm test

  shipped-copies:
    name: Shipped copy (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows, HosterApp/nodejs-assets/nodejs-project]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same test-suite, but against the code that actually ships in each build.
      - run: npm test
        env:
          HOSTER_TEST_ROOT: ${{ github.workspace }}/${{ matrix.target }}

  app:
    name: Mobile app (types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HosterApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: HosterApp/package-lock.json
      # --ignore-scripts: skip the nodejs-mobile native binary download, not needed for type-check/Jest
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx jest --ci
